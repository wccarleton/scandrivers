[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scandrivers"
version = "0.1.0"
description = "Pluggable device drivers for loading structured lab instrument data into pandas DataFrames. Developed by the Max Planck Institute for Geoanthropology (MPIGEA) for geoarchaeological and materials analysis workflows."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Max Planck Institute for Geoanthropology (MPIGEA)" }]
license = { text = "MIT" }
dependencies = ["pandas>=2.0", "openpyxl>=3.0", "xlrd>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyter>=1.0", "pyyaml>=6.0"]

[project.urls]
"Homepage" = "https://github.com/wccarleton/scandrivers"
"Bug Tracker" = "https://github.com/wccarleton/scandrivers/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scandrivers = [
    "demo_data/**/*",
]

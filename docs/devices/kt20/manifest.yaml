device: kt20
name: KT20 magnetic susceptibility scanner
status: supported
summary: Loads KT20 scan exports into a tidy pandas DataFrame.
source_directory: ../../../src/scandrivers/demo_data/kt20/kt20_0467
expected_files:
  - record_scanner_10khz_*.csv
required_columns:
  - record_id
  - date
  - time
  - frequency
  - pin
  - diameter_correction
produced_columns:
  - measurement_index
  - susceptibility_10_3si
  - trigger_data
notes:
  - The driver expects the scan CSV header with metadata on the first row and measurement values on subsequent rows.
  - The demo scan data lives under src/scandrivers/demo_data/kt20/kt20_0467.
